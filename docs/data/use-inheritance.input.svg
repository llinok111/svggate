<svg xmlns="http://www.w3.org/2000/svg" width="100" height="100" viewBox="0 0 100 100">
  <!-- upstream issue #2239: fill-opacity="1" is the only thing blocking inheritance -->
  <g id="a"><rect width="10" height="10" fill-opacity="1"/></g>
  <g fill-opacity=".3"><use href="#a" transform="scale(5)"/></g>
</svg>
